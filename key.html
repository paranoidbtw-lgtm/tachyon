<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tachyon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a10;color:#fff;
display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#12121c;border:1px solid #1e1e30;border-radius:16px;padding:48px 40px;
text-align:center;max-width:420px;width:90%}
.logo{width:56px;height:56px;border-radius:12px;margin:0 auto 20px;
background:linear-gradient(135deg,#8b5cf6,#5818be);display:flex;align-items:center;
justify-content:center;font-size:24px;font-weight:bold}
h1{font-size:20px;margin-bottom:8px}
.msg{color:#9898b0;font-size:14px;margin-bottom:24px}
.key-box{background:#0a0a10;border:1px solid #3c3c54;border-radius:10px;padding:14px 20px;
font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;color:#a78bfa;
cursor:pointer;transition:border-color .2s,color .2s;user-select:all}
.key-box:hover{border-color:#8b5cf6}
.key-box.copied{border-color:#22c55e;color:#22c55e}
.hint{color:#606078;font-size:12px;margin-top:12px}
.err{color:#f87171}
.spinner{width:24px;height:24px;border:3px solid #1e1e30;border-top-color:#8b5cf6;
border-radius:50%;animation:spin .6s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">T</div>
  <h1>TACHYON</h1>
  <div id="content">
    <p class="msg">Retrieving your key...</p>
    <div class="spinner"></div>
  </div>
</div>
<script>
var API = "https://script.google.com/macros/s/AKfycbxVdQy7bWGoLdyRnrarR1FDAgfwSZENJep-cjzeJQTg7-IzC-kxOkS3PqDfZV0-s_mK/exec";

function getParam(name) {
  var m = location.search.match(new RegExp("[?&]" + name + "=([^&]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function showKey(key) {
  document.getElementById("content").innerHTML =
    '<p class="msg">Your key is ready!</p>' +
    '<div class="key-box" id="keybox">' + esc(key) + '</div>' +
    '<p class="hint">Click the key to copy it, then paste it in the app.</p>';
  document.getElementById("keybox").addEventListener("click", function() {
    navigator.clipboard.writeText(key);
    this.classList.add("copied");
    this.textContent = "Copied!";
    var el = this, orig = key;
    setTimeout(function() { el.classList.remove("copied"); el.textContent = orig; }, 1500);
  });
}

function showError(msg) {
  document.getElementById("content").innerHTML =
    '<p class="msg err">' + esc(msg) + '</p>';
}

function onKeyResult(data) {
  if (data && data.ok && data.key) {
    showKey(data.key);
  } else {
    showError((data && data.reason) || "Something went wrong. Please try again.");
  }
}

(function() {
  var sid = getParam("sid");
  if (!sid) { showError("Missing session. Please start over from the app."); return; }

  var s = document.createElement("script");
  s.src = API + "?action=complete&sid=" + encodeURIComponent(sid) + "&callback=onKeyResult";
  s.onerror = function() { showError("Could not reach the server. Please try again."); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
